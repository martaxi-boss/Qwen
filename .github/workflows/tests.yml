name: Qwen Unified checks
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile skills/qwen-unified/scripts/qwen_unified.py
